{{- $alert := "CNPGClusterPhysicalReplicationLagWarning" -}}
{{- if not (has $alert .excludeRules) -}}
alert: {{ $alert }}
annotations:
  summary: CNPG Cluster high physical replication lag
  description: |-
    CloudNativePG Cluster "{{ .namespace }}/{{ .cluster }}" is experiencing a high physical replication lag of {{ "{{ $value | humanizeDuration }}" }}.

    High replication lag indicates network issues, busy instances, slow queries or suboptimal configuration.
    Measured on the primary (pg_stat_replication.replay_lag), so long transactions without commits do not count as lag.
  runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
expr: |
  max(cnpg_pg_stat_replication_replay_lag_seconds{namespace="{{ .namespace }}",pod=~"{{ .podSelector }}"}) > 1
for: 5m
labels:
  severity: warning
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
{{- end -}}
