{{- $alert := "CNPGClusterHACritical" -}}
{{- /* A single-instance cluster never has a standby, so the alert would fire permanently. */ -}}
{{- if and (not (has $alert .excludeRules)) (ge (int .Values.instances) 2) -}}
alert: {{ $alert }}
annotations:
  summary: CNPG Cluster has no standby replicas!
  description: |-
    CloudNativePG Cluster "{{ .labels.job }}" has no ready standby replicas. Your cluster is at severe
    risk of data loss and downtime if the primary instance fails.

    The primary instance is still online and able to serve queries, although connections to the `-ro` endpoint
    will fail. The `-r` endpoint is operating at reduced capacity and all traffic is being served by the main.

    This can happen during a normal fail-over or automated minor version upgrades in a cluster with 2 or less
    instances. The replaced instance may need some time to catch-up with the cluster primary instance.
  runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHACritical.md
expr: |
  max by (job) (cnpg_pg_replication_streaming_replicas{namespace="{{ .namespace }}"} - cnpg_pg_replication_is_wal_receiver_up{namespace="{{ .namespace }}"}) < 1
    and on (job)
  (max by (job) (cnpg_collector_replica_mode{namespace="{{ .namespace }}"}) == 0)
for: 5m
labels:
  severity: critical
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
{{- end -}}
