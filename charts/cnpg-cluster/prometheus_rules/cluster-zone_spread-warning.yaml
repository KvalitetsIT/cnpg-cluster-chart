{{- $alert := "CNPGClusterZoneSpreadWarning" -}}
{{- /* Without zone spreading the instances are not meant to be in separate zones, so the alert would fire
       permanently wherever kube_node_labels is exported, and say nothing useful anywhere else.
       CNPG spreads on zones either through topologySpreadConstraints or through its own pod anti-affinity. */ -}}
{{- $zoneSpread := false -}}
{{- with .Values.affinity -}}
{{- if and (ne .enablePodAntiAffinity false) (eq .topologyKey "topology.kubernetes.io/zone") -}}{{- $zoneSpread = true -}}{{- end -}}
{{- end -}}
{{- range .Values.topologySpreadConstraints -}}
{{- if eq .topologyKey "topology.kubernetes.io/zone" -}}{{- $zoneSpread = true -}}{{- end -}}
{{- end -}}
{{- if and (not (has $alert .excludeRules)) $zoneSpread -}}
alert: {{ $alert }}
annotations:
  summary: CNPG Cluster instances in the same zone.
  description: |-
    CloudNativePG Cluster "{{ .namespace }}/{{ .cluster }}" has instances in the same availability zone.

    A disaster in one availability zone will lead to a potential service disruption and/or data loss.
  runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterZoneSpreadWarning.md
expr: |
  {{ .Values.instances }} > count(count by (label_topology_kubernetes_io_zone) (kube_pod_info{namespace="{{ .namespace }}", pod=~"{{ .podSelector }}"} * on(node,instance) group_left(label_topology_kubernetes_io_zone) kube_node_labels)) < 3
for: 5m
labels:
  severity: warning
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
{{- end -}}
