{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- $name := include "cnpg-cluster.fullname" . }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-cnpg-cluster" $name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
spec:
  groups:
    - name: cloudnative-pg/{{ $name }}
      rules:
        {{- $dict := dict "excludeRules" .Values.monitoring.prometheusRule.excludeRules -}}
        {{- $_ := set $dict "value"       "{{ $value }}" -}}
        {{- $_ := set $dict "namespace"   .Release.Namespace -}}
        {{- $_ := set $dict "cluster"     $name -}}
        {{- $_ := set $dict "labels"      (dict "job" "{{ $labels.job }}" "node" "{{ $labels.node }}" "pod" "{{ $labels.pod }}") -}}
        {{- $_ := set $dict "podSelector" (printf "%s-([1-9][0-9]*)$" $name) -}}
        {{- $_ := set $dict "Values"      .Values -}}
        {{- range $path, $_ := .Files.Glob "prometheus_rules/**.yaml" }}
        {{- $tpl := tpl ($.Files.Get $path) $dict | nindent 10 | trim -}}
        {{- with $tpl }}
        - {{ $tpl }}
        {{- end -}}
        {{- end -}}
{{- end }}
