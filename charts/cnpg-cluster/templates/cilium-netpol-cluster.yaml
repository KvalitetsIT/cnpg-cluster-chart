{{- define "cnpg-cluster.netpol.cluster" -}}
{{- $name := include "cnpg-cluster.fullname" . -}}
endpointSelector:
  matchLabels:
    cnpg.io/cluster: {{ $name }}
egress:
  - toEntities:
      - kube-apiserver
    toPorts:
      - ports:
          - port: "6443"
            protocol: TCP
  - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s:k8s-app: kube-dns
    toPorts:
      - ports:
          - port: "53"
            protocol: UDP
          - port: "53"
            protocol: TCP
        rules:
          dns:
            - matchPattern: "*"
ingress:
  - fromEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: cnpg-system
          app.kubernetes.io/name: cloudnative-pg
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: data-storage-services
          app.kubernetes.io/name: cloudnative-pg
    toPorts:
      - ports:
          - port: "8000"
            protocol: TCP
{{- end -}}
{{- include "templates.ciliumNetworkPolicy" (dict
  "root" $
  "name" (printf "%s-cnpg-cluster" (include "cnpg-cluster.fullname" .))
  "value" (include "cnpg-cluster.netpol.cluster" . | fromYaml)
) }}
