{{- if and .Values.objectStore.enabled .Values.global.objectStore.configuration.endpointURL (.Capabilities.APIVersions.Has "cilium.io/v2") }}
{{- $name := include "cnpg-cluster.fullname" . }}
{{- $endpointRaw := trim .Values.global.objectStore.configuration.endpointURL }}
{{- $endpointNoScheme := regexReplaceAll "^[a-zA-Z][a-zA-Z0-9+.-]*://" $endpointRaw "" }}
{{- $endpointNoPath := regexReplaceAll "/.*$" $endpointNoScheme "" }}
{{- $endpointFQDN := regexReplaceAll ":[0-9]+$" $endpointNoPath "" }}
{{- if empty $endpointFQDN }}
{{- fail "global.objectStore.configuration.endpointURL must contain a valid hostname" }}
{{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ printf "%s-cnpg-cluster-s3" $name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: {{ $name | quote }}
  egress:
    - toFQDNs:
        - matchName: {{ $endpointFQDN | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
