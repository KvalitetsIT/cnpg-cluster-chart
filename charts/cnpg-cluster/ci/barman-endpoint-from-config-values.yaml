imageName: ghcr.io/cloudnative-pg/postgresql:18.3-202604270853-system-bookworm@sha256:73110ae76402e63a849eb4f4dfb7608d2222758cbf2d66a2df60628458b9cd4f
instances: 1
storage:
  size: 1Gi

# endpointURL set under objectStore.configuration only.
# The sync helper should propagate it to global.objectStore.endpointURL
# so the CiliumNetworkPolicy egress rule renders correctly.
objectStore:
  enabled: true
  configuration:
    destinationPath: s3://my-bucket/
    endpointURL: hel1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: aws-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: aws-creds
        key: ACCESS_SECRET_KEY

backup:
  scheduledBackups:
    - name: daily
      schedule: "0 0 3 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
