imageName: ghcr.io/cloudnative-pg/postgresql:16.6
instances: 1

storage:
  size: 1Gi
walStorage:
  enabled: true
  size: 256Mi

postgresql:
  parameters:
    max_connections: "100"
    shared_buffers: 128MB
  pg_hba:
    - host all all 10.0.0.0/8 md5
  shared_preload_libraries:
    - pg_stat_statements

initdb:
  database: app
  owner: app
  postInitApplicationSQL:
    - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

# Resources apply to all instance pods, including during initdb bootstrap.
# There is no separate resource spec for the initialization job.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

roles:
  - name: app
    ensure: present
    login: true
    passwordSecret:
      name: app-secret

databases:
  - name: app
    ensure: present
    owner: app

backup:
  enabled: false
  scheduledBackups:
    - name: daily
      schedule: "0 0 0 * * *"
      backupOwnerReference: self
      method: barmanObjectStore

monitoring:
  enabled: false

poolers:
  - name: rw
    instances: 1
    type: rw
    pgbouncer:
      poolMode: transaction
      parameters:
        max_client_conn: "100"
        default_pool_size: "5"
