# -- Global values propagated to all chart dependencies.
# @default -- see values.yaml
# @section -- Global
global:
  objectStore:
    configuration:
      # -- S3-compatible endpoint URL. Mirrors objectStore.configuration.endpointURL and is accessible to subchart dependencies (e.g. CiliumNetworkPolicy egress rules).
      # @default -- ""
      # @section -- Global
      endpointURL: ""

# -- Override the Cluster name.
# @default -- Release name
# @section -- Cluster
nameOverride: ""

# -- Metadata overrides for the Cluster resource.
# @default -- {}
# @section -- Cluster
metadata: {}

# -- Number of PostgreSQL instances in the cluster.
# @default -- 1
# @section -- Cluster
instances: 1

# -- Manage the PodDisruptionBudget for the cluster.
# When null (default), the chart automatically sets this to `false` for single-instance clusters (instances=1)
# and leaves it unset (operator default: `true`) for multi-instance clusters.
# Set explicitly to `true` or `false` to override this behaviour.
# @default -- auto
# @section -- Cluster
enablePDB: ~

# -- Passthrough for any ClusterSpec fields not explicitly exposed by chart values.
# Fields here are appended to the Cluster spec as-is. Do not duplicate keys already managed by other values.
# @default -- {}
# @section -- Cluster
clusterSpec: {}

# -- Container image for PostgreSQL. Takes precedence over imageCatalogRef.
# @default -- ""
# @section -- Cluster
imageName: ""

# -- Reference to an ImageCatalog or ClusterImageCatalog resource.
# @default -- {}
# @section -- Cluster
imageCatalogRef: {}

# -- Image pull policy for the PostgreSQL container.
# @default -- IfNotPresent
# @section -- Cluster
imagePullPolicy: IfNotPresent

# -- Image pull secrets for private registries.
# @default -- []
# @section -- Cluster
imagePullSecrets: []

# -- PVC storage configuration for PostgreSQL data.
# @default -- see values.yaml
# @section -- Storage
storage:
  # -- Size of the PVC for PostgreSQL data.
  # @default -- 8Gi
  # @section -- Storage
  size: 8Gi
  # -- Storage class for the data PVC.
  # @default -- cluster default
  # @section -- Storage
  storageClass: ""

# -- Separate PVC configuration for WAL files.
# @default -- see values.yaml
# @section -- WAL Storage
walStorage:
  # -- Set to true to use a separate PVC for WAL files.
  # @default -- false
  # @section -- WAL Storage
  enabled: false
  # -- Size of the WAL PVC.
  # @default -- 1Gi
  # @section -- WAL Storage
  size: 1Gi
  # -- Storage class for the WAL PVC.
  # @default -- cluster default
  # @section -- WAL Storage
  storageClass: ""

# -- PostgreSQL engine configuration.
# @default -- see values.yaml
# @section -- PostgreSQL
postgresql:
  # -- PostgreSQL configuration parameters (postgresql.conf knobs).
  # @default -- {}
  # @section -- PostgreSQL
  parameters: {}
  # -- pg_hba.conf rules appended after the operator-managed entries.
  # @default -- []
  # @section -- PostgreSQL
  pg_hba: []
  # -- pg_ident.conf rules.
  # @default -- []
  # @section -- PostgreSQL
  pg_ident: []
  # -- Libraries added to shared_preload_libraries.
  # @default -- []
  # @section -- PostgreSQL
  shared_preload_libraries: []

# -- initdb bootstrap config. Maps to spec.bootstrap.initdb.
# @default -- {}
# @section -- Bootstrap
initdb: {}

# -- Recovery bootstrap config. Maps to spec.bootstrap.recovery.
# @default -- {}
# @section -- Bootstrap
recovery: {}

# -- pg_basebackup bootstrap config. Maps to spec.bootstrap.pg_basebackup.
# @default -- {}
# @section -- Bootstrap
pgBaseBackup: {}

# -- External cluster definitions used for recovery or replica sources. Maps to spec.externalClusters.
# @default -- []
# @section -- Bootstrap
externalClusters: []

# -- Replica cluster configuration. Maps to spec.replica.
# @default -- {}
# @section -- Replication
replica: {}

# -- Replication slot configuration. Maps to spec.replicationSlots.
# @default -- {}
# @section -- Replication
replicationSlots: {}

# -- Declarative role management. Maps to spec.managed.roles. See [example](#roles--databases-1) and the [RoleConfiguration API](https://cloudnative-pg.io/docs/1.29/cloudnative-pg.v1#roleconfiguration).
# @default -- []
# @section -- Roles & Databases
roles: []

# -- List of Database CRD resources to create. Each entry requires a name field.
# The cluster reference is auto-injected. All other fields map directly to the Database spec. See [example](#roles--databases-1) and the [Database API](https://cloudnative-pg.io/docs/1.29/cloudnative-pg.v1#database).
# @default -- []
# @section -- Roles & Databases
databases: []

# -- VolumeSnapshot backup, scheduled backups, and WAL settings.
# @default -- see values.yaml
# @section -- Backup
backup:
  # -- Which instance to take backups from. prefer-standby avoids load on the primary.
  # @default -- prefer-standby
  # @section -- Backup
  target: prefer-standby

  # -- Backup retention policy (e.g. "30d", "10" for 10 backups).
  # @default -- "30d"
  # @section -- Backup
  retentionPolicy: "30d"

  volumeSnapshot:
    # -- Set to true to enable VolumeSnapshot-based backups.
    # @default -- false
    # @section -- Backup
    enabled: false
    # -- VolumeSnapshotClass for the data volume snapshot.
    # @default -- ""
    # @section -- Backup
    className: ""
    # -- VolumeSnapshotClass for the WAL volume snapshot.
    # @default -- ""
    # @section -- Backup
    walClassName: ""
    # -- Take the snapshot while the instance is running (online snapshot).
    # @default -- true
    # @section -- Backup
    online: true
    # -- Which resource owns the snapshots (cluster or none).
    # @default -- cluster
    # @section -- Backup
    snapshotOwnerReference: cluster

  # -- List of ScheduledBackup resources to create for this cluster. See the [ScheduledBackup API](https://cloudnative-pg.io/docs/1.29/cloudnative-pg.v1#scheduledbackup).
  # @default -- []
  # @section -- Backup
  scheduledBackups: []

# -- Additional plugins to inject into the Cluster spec.
# The barman-cloud plugin entry is auto-injected when objectStore.enabled is true.
# @default -- []
# @section -- Plugins
plugins: []

# -- Monitoring configuration including PodMonitor and custom queries.
# @default -- see values.yaml
# @section -- Monitoring
monitoring:
  # -- Set to true to enable monitoring.
  # @default -- false
  # @section -- Monitoring
  enabled: false
  # -- Set to true to create a PodMonitor resource.
  # @default -- true
  # @section -- Monitoring
  enablePodMonitor: true
  # -- Relabeling rules applied to scraped metrics.
  # @default -- []
  # @section -- Monitoring
  podMonitorRelabelings: []
  # -- Metric relabeling rules applied after scraping.
  # @default -- []
  # @section -- Monitoring
  podMonitorMetricRelabelings: []
  # -- Disable the default Prometheus queries shipped by CNPG.
  # @default -- false
  # @section -- Monitoring
  disableDefaultQueries: false
  # -- References to secrets containing custom Prometheus queries (ConfigMap key: custom-queries.yaml).
  # @default -- []
  # @section -- Monitoring
  customQueriesSecret: []

# -- CPU and memory resource requests/limits for the PostgreSQL container.
# @default -- {}
# @section -- Resources & Scheduling
resources: {}

# -- PriorityClass for the PostgreSQL pods.
# @default -- ""
# @section -- Resources & Scheduling
priorityClassName: ""

# -- Node selector for the PostgreSQL pods.
# @default -- {}
# @section -- Resources & Scheduling
nodeSelector: {}

# -- Tolerations for the PostgreSQL pods.
# @default -- []
# @section -- Resources & Scheduling
tolerations: []

# -- Topology spread constraints for the PostgreSQL pods.
# @default -- []
# @section -- Resources & Scheduling
topologySpreadConstraints: []

# -- Affinity rules for the PostgreSQL pods.
# @default -- {}
# @section -- Resources & Scheduling
affinity: {}

# -- Allow direct connections to the postgres superuser.
# @default -- true
# @section -- Access & Security
enableSuperuserAccess: true

# -- Name of an existing secret containing the superuser password.
# @default -- ""
# @section -- Access & Security
superuserSecret: ""

# -- Method used to perform a controlled switchover (switchover or restart).
# @default -- switchover
# @section -- Lifecycle
primaryUpdateMethod: switchover

# -- When to apply updates: unsupervised applies them automatically.
# @default -- unsupervised
# @section -- Lifecycle
primaryUpdateStrategy: unsupervised

# -- Extra environment variables for the PostgreSQL container.
# @default -- []
# @section -- Metadata & Volumes
env: []

# -- Extra environment variables sourced from ConfigMaps or Secrets.
# @default -- []
# @section -- Metadata & Volumes
envFrom: []

# -- List of Pooler (PgBouncer) resources to create for this cluster.
# @default -- []
# @section -- Poolers
poolers: []

# -- ObjectStore resource for the barman-cloud plugin.
# Enabling this automatically injects the plugin entry into the Cluster spec.
# @default -- see values.yaml
# @section -- Object Store
objectStore:
  # -- Set to true to create an ObjectStore resource and enable the barman-cloud plugin.
  # @default -- false
  # @section -- Object Store
  enabled: false
  # -- Backup retention policy.
  # @default -- "30d"
  # @section -- Object Store
  retentionPolicy: "30d"
  # -- ObjectStore configuration. Set destinationPath and s3Credentials at minimum.
  # Note: endpointURL is set under global.objectStore.configuration.endpointURL (not here),
  # so it propagates to subchart dependencies such as the CiliumNetworkPolicy egress template.
  # Setting it here instead will produce a validation error at render time.
  # @default -- see values.yaml
  # @section -- Object Store
  configuration:
    # -- S3 destination path for backups (e.g. s3://my-bucket/my-cluster). Required.
    # @default -- ""
    # @section -- Object Store
    destinationPath: ""
    # -- S3 credentials referencing Kubernetes secret keys.
    # @default -- {}
    # @section -- Object Store
    s3Credentials:
      # -- Secret key reference for the S3 access key ID.
      # @default -- {}
      # @section -- Object Store
      accessKeyId: {}
      # -- Secret key reference for the S3 secret access key.
      # @default -- {}
      # @section -- Object Store
      secretAccessKey: {}
    wal:
      # -- Compression algorithm for WAL files (gzip, bzip2, snappy).
      # @default -- gzip
      # @section -- Object Store
      compression: gzip
      # -- Number of parallel WAL upload workers.
      # @default -- 8
      # @section -- Object Store
      maxParallel: 8
    data:
      # -- Compression algorithm for base backup data files (gzip, bzip2, snappy).
      # @default -- gzip
      # @section -- Object Store
      compression: gzip
      # -- Number of parallel data upload workers.
      # @default -- 8
      # @section -- Object Store
      jobs: 8
  # -- Sidecar container configuration for the barman-cloud plugin.
  # @default -- see values.yaml
  # @section -- Object Store
  instanceSidecarConfiguration:
    resources:
      limits:
        # -- Memory limit for the barman-cloud sidecar.
        # @default -- 512Mi
        # @section -- Object Store
        memory: 512Mi
        # -- CPU limit for the barman-cloud sidecar.
        # @default -- 500m
        # @section -- Object Store
        cpu: 500m
      requests:
        # -- Memory request for the barman-cloud sidecar.
        # @default -- 256Mi
        # @section -- Object Store
        memory: 256Mi
        # -- CPU request for the barman-cloud sidecar.
        # @default -- 250m
        # @section -- Object Store
        cpu: 250m

# -- CiliumNetworkPolicy resources. Each entry is rendered by the templates chart helper
# with root set to this chart's context, so template strings (e.g. include "cnpg-cluster.fullname")
# resolve correctly. The map key is used as a name suffix; the cluster fullname is prepended automatically.
# Set enabled: false on any entry to suppress it.
# @default -- see values.yaml
# @section -- Network Policies
ciliumNetworkPolicies:
  cnpg-cluster:
    endpointSelector:
      matchLabels:
        cnpg.io/cluster: '{{ include "cnpg-cluster.fullname" . }}'
    egress:
      - toEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s:k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: cnpg-system
              app.kubernetes.io/name: cloudnative-pg
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: data-storage-services
              app.kubernetes.io/name: cloudnative-pg
        toPorts:
          - ports:
              - port: "8000"
                protocol: TCP

  cnpg-cluster-initdb:
    endpointSelector:
      matchLabels:
        cnpg.io/cluster: '{{ include "cnpg-cluster.fullname" . }}'
        cnpg.io/jobRole: initdb
    egress:
      - toEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP

  cnpg-cluster-intracluster:
    endpointSelector:
      matchLabels:
        cnpg.io/cluster: '{{ include "cnpg-cluster.fullname" . }}'
    egress:
      - toEndpoints:
          - matchLabels:
              cnpg.io/cluster: '{{ include "cnpg-cluster.fullname" . }}'
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
              - port: "8000"
                protocol: TCP
    ingress:
      - fromEndpoints:
          - matchLabels:
              cnpg.io/cluster: '{{ include "cnpg-cluster.fullname" . }}'
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
              - port: "8000"
                protocol: TCP

# -- Standard NetworkPolicy resources for pod-to-pod traffic that does not require
# Cilium-specific features. Rendered with the same iterator pattern as ciliumNetworkPolicies.
# @default -- see values.yaml
# @section -- Network Policies
networkPolicies:
  cnpg-cluster:
    podSelector:
      matchLabels:
        cnpg.io/cluster: '{{ include "cnpg-cluster.fullname" . }}'
    egress:
      # API Server
      - to:
          - ipBlock:
              cidr: 10.96.0.1/32
          - ipBlock:
              cidr: 10.43.0.1/32
        ports:
          - port: 6443
            protocol: TCP
      # DNS
      - to:
          - ipBlock:
              cidr: 169.254.20.10/32
          - ipBlock:
              cidr: 10.43.0.10/32
        ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: cnpg-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: cloudnative-pg
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: data-storage-services
            podSelector:
              matchLabels:
                app.kubernetes.io/name: cloudnative-pg
        ports:
          - port: 8000
            protocol: TCP

  cnpg-cluster-initdb:
    podSelector:
      matchLabels:
        cnpg.io/cluster: '{{ include "cnpg-cluster.fullname" . }}'
        cnpg.io/jobRole: initdb
    egress:
      # API Server
      - to:
          - ipBlock:
              cidr: 10.96.0.1/32
          - ipBlock:
              cidr: 10.43.0.1/32
        ports:
          - port: 6443
            protocol: TCP

  cnpg-cluster-intracluster:
    podSelector:
      matchLabels:
        cnpg.io/cluster: '{{ include "cnpg-cluster.fullname" . }}'
    egress:
      - to:
          - podSelector:
              matchLabels:
                cnpg.io/cluster: '{{ include "cnpg-cluster.fullname" . }}'
        ports:
          - port: 5432
            protocol: TCP
          - port: 8000
            protocol: TCP
    ingress:
      - from:
          - podSelector:
              matchLabels:
                cnpg.io/cluster: '{{ include "cnpg-cluster.fullname" . }}'
        ports:
          - port: 5432
            protocol: TCP
          - port: 8000
            protocol: TCP

  cnpg-cluster-prometheus:
    podSelector:
      matchLabels:
        cnpg.io/cluster: '{{ include "cnpg-cluster.fullname" . }}'
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: infrastructure
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
        ports:
          - port: 9187
            protocol: TCP
