name: PR

on:
  pull_request:

permissions: {}

jobs:
  docs:
    name: Validating docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Generate docs
        run: make docs

      - name: Check for uncommitted doc changes
        run: |
          if ! git diff --exit-code -- charts/cnpg/README.md; then
            echo ""
            echo "Chart READMEs are out of date. Run 'make docs' locally and commit the result."
            exit 1
          fi

  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.17.0"

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.x

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          echo "Changed charts:"
          echo "$changed"

          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --config ct.yaml

      - name: Kubernetes KinD Cluster
        id: kind
        uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab # v1.13.0
        if: steps.list-changed.outputs.changed == 'true'

      - name: Install CRDs
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CNPG_VERSION: v1.29.0
          BARMAN_PLUGIN_VERSION: v0.12.0
        run: |
          wait_for_crd() {
            local crd="$1"
            kubectl wait --for=condition=Established --timeout=60s "crd/${crd}" \
              || kubectl wait --for=condition=Established --timeout=60s "crd/${crd}"
          }

          CNPG_BASE="https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/refs/tags/${CNPG_VERSION}/config/crd/bases"
          kubectl apply --server-side -f "${CNPG_BASE}/postgresql.cnpg.io_clusters.yaml"
          kubectl apply --server-side -f "${CNPG_BASE}/postgresql.cnpg.io_poolers.yaml"
          kubectl apply --server-side -f "${CNPG_BASE}/postgresql.cnpg.io_databases.yaml"
          kubectl apply --server-side -f "${CNPG_BASE}/postgresql.cnpg.io_scheduledbackups.yaml"
          wait_for_crd clusters.postgresql.cnpg.io
          wait_for_crd poolers.postgresql.cnpg.io
          wait_for_crd databases.postgresql.cnpg.io
          wait_for_crd scheduledbackups.postgresql.cnpg.io

          BARMAN_BASE="https://raw.githubusercontent.com/cloudnative-pg/plugin-barman-cloud/refs/tags/${BARMAN_PLUGIN_VERSION}/config/crd/bases"
          kubectl apply --server-side -f "${BARMAN_BASE}/barmancloud.cnpg.io_objectstores.yaml"
          wait_for_crd objectstores.barmancloud.cnpg.io

      - name: Add Helm repositories
        run: |
          helm repo add kvalitetsit https://raw.githubusercontent.com/KvalitetsIT/helm-repo/master/
          helm repo update

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct install --config ct.yaml
