name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Verify Release Metadata
    if: github.repository == 'KvalitetsIT/cnpg-cluster-chart'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - id: verify
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi
          chart_version="$(yq '.version' charts/cnpg-cluster/Chart.yaml)"
          app_version="$(yq '.appVersion' charts/cnpg-cluster/Chart.yaml)"

          [[ "${version}" == "${chart_version}" ]] || {
            echo "Chart.yaml version (${chart_version}) does not match tag (${version})"
            exit 1
          }

          if [[ "${prerelease}" == "false" ]]; then
            [[ "${version}" == "${app_version}" ]] || {
              echo "Chart.yaml appVersion (${app_version}) does not match tag (${version})"
              exit 1
            }
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

  helm:
    name: Publish Helm Chart
    if: github.repository == 'KvalitetsIT/cnpg-cluster-chart'
    runs-on: ubuntu-latest
    needs:
      - metadata
    permissions:
      contents: read
      id-token: write # Required for trusted publishing of Helm artifacts.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        name: Setup Helm
        with:
          version: "v3.17.0"

      - name: Build Chart
        run: helm package charts/cnpg-cluster

      - name: Configure Git
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "development@kvalitetsit.dk"

      - name: Checkout Helm repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: KvalitetsIT/helm-repo
          token: ${{ secrets.KIT_GITHUB_ACCESS }}
          path: helm-repo
          persist-credentials: false

      - name: Publish chart
        env:
          TAG: ${{ needs.metadata.outputs.version }}
          KIT_GITHUB_ACCESS: ${{ secrets.KIT_GITHUB_ACCESS }}
        run: |
          set -euo pipefail
          mkdir -p helm-repo/cnpg-cluster
          cp cnpg-cluster-*.tgz helm-repo/cnpg-cluster/
          cd helm-repo
          git remote set-url origin "https://${KIT_GITHUB_ACCESS}:x-oauth-basic@github.com/KvalitetsIT/helm-repo"
          helm repo index . --url https://raw.githubusercontent.com/KvalitetsIT/helm-repo/master/
          git add -A
          git commit -m "chore: release cnpg-cluster chart v${TAG}" || exit 0
          git push

  github-release:
    name: Create GitHub Release
    if: github.repository == 'KvalitetsIT/cnpg-cluster-chart'
    needs:
      - helm
      - metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub release for the tag.
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.metadata.outputs.version }}
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
